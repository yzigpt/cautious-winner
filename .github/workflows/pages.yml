name: Deploy Static Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifact
        run: |
          mkdir -p _site
          rsync -av ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'data/' \
            --exclude '*.log' \
            --exclude '.server.*' \
            --exclude '.tunnel.*' \
            --exclude 'server.js' \
            --exclude 'package.json' \
            --exclude 'render.yaml' \
            --exclude 'DEPLOY_RENDER.md' \
            --exclude 'DEPLOY_RAILWAY.md'
          cp index.min.html _site/index.html
          cp styles.min.css _site/styles.css
          cp site-shell.min.js _site/site-shell.js
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
