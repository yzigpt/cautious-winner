<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" />
    <title>Установить пароль - Frog Oxide Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page page--site access-page">
      <section class="card access-card">
        <p class="eyebrow">Подтверждение email</p>
        <h1>Установите пароль для нового аккаунта</h1>
        <p class="section-copy">Ссылка из письма подтверждает ваш email. После установки пароля вы сможете войти в личный кабинет.</p>
        <form class="auth-form" id="set-password-form">
          <label class="field"><span>Новый пароль</span><input id="new-password" type="password" autocomplete="new-password" minlength="8" required /></label>
          <label class="field"><span>Повторите пароль</span><input id="repeat-password" type="password" autocomplete="new-password" minlength="8" required /></label>
          <button class="submit-btn" type="submit">Сохранить пароль</button>
        </form>
        <p class="auth-status" id="set-password-status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="set-password.js"></script>
  </body>
</html>
